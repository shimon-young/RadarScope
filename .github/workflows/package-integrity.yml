name: Package Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # .gitattributes fixes each line ending per file type, so these hold
      # regardless of the checkout settings on the runner or the contributor.
      - name: Verify line endings
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::CRLF found; .sh must be LF"
              fail=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*')
          while IFS= read -r f; do
            if ! grep -qU $'\r' "$f"; then
              echo "::error file=$f::LF found; .bat must be CRLF"
              fail=1
            fi
          done < <(find . -name '*.bat' -not -path './.git/*')
          [ "$fail" = 0 ] && echo "All shell/batch line endings correct."

      # The service serves the frontend from frontend/dist and the repository
      # contains no frontend sources, so these files cannot be regenerated.
      - name: Verify frontend is tracked
        shell: bash
        run: |
          fail=0
          for f in frontend/dist/index.html; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "tracked: $f"
            else
              echo "::error file=$f::not tracked; the service would serve no page"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # Apache-2.0 section 4(d) and BSD-3-Clause attribution requirements
      - name: Verify attribution files
        shell: bash
        run: |
          fail=0
          for f in LICENSE THIRD_PARTY_LICENSES.md \
                   RADAR_inference/dynamic_network_architectures/LICENSE \
                   RADAR_inference/dynamic_network_architectures/NOTICE; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "present: $f"
            else
              echo "::error file=$f::missing; required for attribution"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # The text embeddings are not part of the upstream weights repository
      # and infer_text_embedding_radar.pt cannot be recomputed from the model.
      - name: Verify required data files
        shell: bash
        run: |
          fail=0
          for f in ckpt/infer_text_embedding_radar.pt \
                   ckpt/infer_text_embedding_merlin_en.pt \
                   ckpt/bert-base-uncased/vocab.txt; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "present: $f"
            else
              echo "::error file=$f::missing; the package would not run"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      - name: Verify no sensitive content tracked
        shell: bash
        run: |
          fail=0
          if git ls-files | grep -qiE '\.(nii|nii\.gz|dcm|nrrd|mha)$'; then
            echo "::error::medical image files are tracked; this is prohibited"
            git ls-files | grep -iE '\.(nii|nii\.gz|dcm|nrrd|mha)$'
            fail=1
          fi
          if git ls-files | grep -q 'admin_auth\.json'; then
            echo "::error::admin_auth.json is tracked"
            fail=1
          fi
          if git ls-files | grep -qE '^RADAR_inference/env/'; then
            echo "::error::virtualenv is tracked"
            fail=1
          fi
          big=$(git ls-files | grep -E '\.(pth|bin)$' || true)
          if [ -n "$big" ]; then
            echo "::error::model weight files are tracked:"
            echo "$big"
            fail=1
          fi
          [ "$fail" = 0 ] && echo "No sensitive content tracked."

      # architectures/, building_blocks/ and initialization/ are separate
      # packages; a missing one surfaces as an ImportError at runtime.
      - name: Verify vendored modules complete
        shell: bash
        run: |
          count=$(git ls-files 'RADAR_inference/dynamic_network_architectures/*.py' | wc -l)
          echo "vendored .py tracked: $count"
          if [ "$count" -lt 21 ]; then
            echo "::error::expected at least 21 vendored modules, found $count"
            exit 1
          fi

      - name: Verify Python syntax
        run: |
          python -m compileall -q RADAR_inference dynamic_network_architectures 2>/dev/null \
            || python -m compileall -q RADAR_inference
          echo "Python syntax OK."

      - name: Build release archive
        shell: pwsh
        run: ./pack_release.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadarScope-${{ matrix.os }}
          path: dist/RadarScope.zip
          if-no-files-found: error
